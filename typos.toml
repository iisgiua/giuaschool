[files]
# Esclusi dal controllo: librerie di terze parti in public/vendor, source map e
# il logo SVG (i path del disegno contengono sequenze simili a parole).
extend-exclude = [
  "public/vendor/",
  "*.map",
  "public/img/logo-giuaschool.svg",
]

