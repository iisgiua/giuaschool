####################
# MiniRegistroFixtures - storico passato della classe 1A (stile seeder standard)
#
# Il Populator copre da pochi giorni fa in poi: qui si aggiungono le giornate
# precedenti (dal 20/09 all'08/10), così registro, assenze, voti e note non
# risultano vuoti nelle settimane passate. Tutto riferito alla sola 1A:
# la 1B resta volutamente vuota.
####################


include:
  - MiniClassiFixtures.yml
  - MiniUtentiFixtures.yml
  - MiniCattedraFixtures.yml
  - MateriaFixtures.yml


App\Entity\Lezione:
  # ----- ore curricolari passate (prime 2 ore) -----
  lezione_mini_curricolare_a_{1..5}:
    data (unique): '<dateTimeBetween("2026-09-20", "2026-10-08")>'
    ora: 1
    classe: '@classe_1A'
    materia: '@materia_curricolare_1'
    argomento: 'Lezione mini passata: attività didattica svolta'
    attivita: 'Lezione frontale ed esercizi in classe'
    gruppo:
    tipoGruppo: 'N'
    moduloFormativo:
    sostituzione: false
  lezione_mini_curricolare_b_{1..5}:
    data (unique): '<dateTimeBetween("2026-09-20", "2026-10-08")>'
    ora: 2
    classe: '@classe_1A'
    materia: '@materia_curricolare_1'
    argomento: 'Lezione mini passata: prosecuzione del programma'
    attivita: 'Verifica orale e ripasso'
    gruppo:
    tipoGruppo: 'N'
    moduloFormativo:
    sostituzione: false

  # ----- ore di religione passate -----
  lezione_mini_religione_{1..5}:
    data (unique): '<dateTimeBetween("2026-09-20", "2026-10-08")>'
    ora: 6
    classe: '@classe_1A'
    materia: '@materia_RELIGIONE'
    argomento: 'Lezione mini di religione passata'
    attivita: 'Attività in classe'
    gruppo:
    tipoGruppo: 'N'
    moduloFormativo:
    sostituzione: false

  # ----- ore di sostegno passate -----
  lezione_mini_sostegno_{1..2}:
    data (unique): '<dateTimeBetween("2026-09-20", "2026-10-08")>'
    ora: 7
    classe: '@classe_1A'
    materia: '@materia_SOSTEGNO'
    argomento: 'Lezione mini di sostegno passata'
    attivita: 'Attività individualizzata'
    gruppo:
    tipoGruppo: 'N'
    moduloFormativo:
    sostituzione: false

  # ----- sabati (giorno di scuola: solo la domenica è festiva) -----
  # Il Populator salta i weekend: senza queste ore il registro del sabato
  # risulta vuoto. Ora 3 per non sovrapporsi alle altre (1-2, 6, 7).
  # Date esplicite: questa versione di alice non accetta funzioni annidate.
  lezione_mini_sabato_1:
    data: '<date_create("2026-09-19")>'
    ora: 3
    classe: '@classe_1A'
    materia: '@materia_curricolare_1'
    argomento: 'Lezione mini del sabato'
