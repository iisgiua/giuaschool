####################
# MiniDatiFixtures - dati minimi per attivare le sezioni non coperte da DemoPopulator:
# assenze/entrate/uscite (registro assenze), note (registro note),
# avvisi/circolari (bacheche), compiti/verifiche (sezione compiti).
# Il resto (lezioni, valutazioni, scrutini, colloqui, presenze, ...) lo crea DemoPopulator.
####################


