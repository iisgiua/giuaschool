# Aggiunge ore di lezione, firme e assenze-lezione per tutte le classi, in modo
# che il registro di ogni classe risulti popolato. Le date sono comprese
# nell'anno scolastico configurato (2022/2023) per essere visibili nelle pagine
# filtrate per anno.
####################


