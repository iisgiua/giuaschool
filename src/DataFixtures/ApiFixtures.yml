####################
# ApiFixtures - dati di test
#
# Dati per gestire l'uso di API per servizi esterni:
#   nome: nome dell'API
#   token: token univoco per l'API
#   attiva: indica se l'API è attiva o no
#   dati: lista di dati aggiuntivi necessari per le funzionalità dell'API
####################


App\Entity\Api:
  api_{1..5}:
    nome: '<substr(<text()>, 0, 255)>'
    token (unique): '<substr(<text()>, 0, 128)>'
    attiva: '<boolean(50)>'
    dati: '50%? <array_combine(<words(3)>, <sentences(3)>)>: <(array())>'
